name: powergrid-infrastructure

services:
  core-db:
    image: postgres:16.6
    container_name: powergrid-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
    ports:
      - "${POSTGRES_CORE_PORT}:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
    networks:
      - powergrid-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  audit-db:
    image: postgres:16.6
    container_name: powergrid-audit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME}
      POSTGRES_USER: ${AUDIT_DB_USER}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
    ports:
      - "${POSTGRES_AUDIT_PORT}:5432"
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    networks:
      - powergrid-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER} -d ${AUDIT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    container_name: powergrid-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - powergrid-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.0.5-management
    container_name: powergrid-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbit load_definitions "/etc/rabbitmq/definitions.json"
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - powergrid-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  core-service:
    build:
      context: ../powergrid-core-service
      dockerfile: Dockerfile
    container_name: powergrid-core-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CORE_HTTP_PORT: 3001
      CORE_DATABASE_URL: postgresql://${CORE_DB_USER}:${CORE_DB_PASSWORD}@core-db:5432/${CORE_DB_NAME}
    ports:
      - "3001:3001"
    networks:
      - powergrid-internal
    depends_on:
      core-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  live-service:
    build:
      context: ../powergrid-live-service
      dockerfile: Dockerfile
    container_name: powergrid-live-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LIVE_HTTP_PORT: 3002
      LIVE_REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      RABBITMQ_EXCHANGE: powergrid.events
    ports:
      - "3002:3002"
    networks:
      - powergrid-internal
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit-service:
    build:
      context: ../powergrid-audit-service
      dockerfile: Dockerfile
    container_name: powergrid-audit-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUDIT_HTTP_PORT: 3003
    ports:
      - "3003:3003"
    networks:
      - powergrid-internal
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  powergrid-internal:
    name: powergrid-internal
    driver: bridge

volumes:
  core-db-data:
    name: powergrid-core-db-data
  audit-db-data:
    name: powergrid-audit-db-data
  redis-data:
    name: powergrid-redis-data
  rabbitmq-data:
    name: powergrid-rabbitmq-data

